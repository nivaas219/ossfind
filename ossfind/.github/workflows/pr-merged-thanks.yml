name: Thank Contributor After Merge

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  thank-contributor:
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Add thank you comment
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.pull_request.user.login;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ` Thanks @${username} for your contribution!

Your pull request has been successfully merged into OSSFind.

We appreciate your effort and contribution to the project `
            });