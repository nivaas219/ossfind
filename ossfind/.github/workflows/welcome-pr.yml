name: Welcome PR Comment

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  welcome-contributor:
    runs-on: ubuntu-latest

    steps:
      - name: Add welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.pull_request.user.login;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Hi @${username}, thank you for opening this pull request to OSSFind!

We appreciate your effort. Our team will review it shortly.`
            });